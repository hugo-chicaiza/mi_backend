networks:
  # Redes
  public-net: # frontend
  backend-net: # interna backend, Redis, backend Python
  db-net:
    # egura con PostgreSQL y OpenLDAP

volumes:
  # Volumenes persistentes
  pgdata:
  redisdata:
  ldapdata_lib:
  ldapdata_config:


services:
  # Servicioss
  db:
    # PostgreSQL
    image: postgres:16
    container_name: postgres_db
    environment:
      POSTGRES_DB: mi_db
      POSTGRES_USER: postgresql
      POSTGRES_PASSWORD: postgresql123
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U app_admin -d mi_db"]
      interval: 5s
      retries: 5
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ../migrations:/docker-entrypoint-initdb.d
    networks:
      - db-net
    ports:
      - "5432:5432"

  redis:
    # Redis
    image: redis:7
    container_name: redis
    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 5s
      retries: 5
    networks:
      - backend-net
    volumes:
      - redisdata:/data
    ports:
      - "6379:6379"

  redisinsight:
    # RedisInsight
    image: redis/redisinsight:3.2
    container_name: redisinsight
    networks:
      - backend-net
    ports:
      - "8001:8001"

  ldap:
    # OpenLDAP
    image: osixia/openldap:1.5.0
    container_name: openldap
    environment:
      LDAP_ORGANISATION: "MyBank"
      LDAP_DOMAIN: "mybank.local" #dc.dc
      LDAP_ADMIN_PASSWORD: "LDAP123"
    networks:
      - db-net
    volumes:
      - ldapdata_lib:/var/lib/ldap
      - ldapdata_config:/etc/ldap/slapd.d
    ports:
      - "389:389"
    healthcheck:
      test: ["CMD-SHELL", "ldapsearch -x -H ldap://ldap -D 'cn=admin,dc=mybank,dc=local' -w LDAP123 -b dc=mybank,dc=local || exit 1"]
      #test: ["CMD-SHELL", "ldapsearch -x -H ldap://localhost -D 'cn=admin,dc=mybank,dc=local' -w LDAP123 -b dc=mybank,dc=local || exit 1"]
      interval: 30s
      retries: 3
      start_period: 60s

  backend:
    # Backend Python
    build: ./backend
    container_name: backend_container
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      ldap:
        condition: service_healthy
    networks:
      - backend-net
      - db-net
    environment:
      DATABASE_URL: postgres://app_admin:appadmin123@db:5432/mi_db
      REDIS_URL: redis://redis:6379
      LDAP_URL: ldap://ldap:389
    volumes:
      - ../backend:/app # bind mount solo para desarrollo
    command: [ "python", "main.py" ]
    ports:
      - "8080:8080"

  frontend:
    # Frontend React
    build: ./frontend
    container_name: frontend_container
    networks:
      - public-net
      - backend-net
    ports:
      - "3000:3000"
    volumes:
      - ../frontend:/app # bind mount solo para desarrollo, reflejar cambios en tiempo real
    depends_on:
      - backend
